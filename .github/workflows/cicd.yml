name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'tests/**.py'
      - 'params.yaml'
      - 'requirements.txt'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

concurrency:
  group: income-model-release
  cancel-in-progress: false

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Pull training and holdout data
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python src/train.py
      - name: Verify training run was saved to DagsHub
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.parse import urlparse

          from mlflow.tracking import MlflowClient

          tracking_uri = os.environ["MLFLOW_TRACKING_URI"]
          parsed = urlparse(tracking_uri)
          if parsed.scheme != "https" or parsed.hostname != "dagshub.com":
              raise SystemExit("MLFLOW_TRACKING_URI must point to DagsHub over HTTPS")
          with open("outputs/report.json", encoding="utf-8") as report_file:
              report = json.load(report_file)
          run = MlflowClient().get_run(report["mlflow_run_id"])
          for metric in ("f1_score", "accuracy"):
              if abs(run.data.metrics[metric] - report[metric]) > 1e-9:
                  raise SystemExit(f"DagsHub {metric} does not match the CI report")
          print(f"Verified DagsHub MLflow run {run.info.run_id} with F1 and accuracy")
          PY
      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1=$F1" >> "$GITHUB_OUTPUT"
      - name: Stage immutable candidate
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: python -m src.artifacts stage
      - name: Save evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install boto3==1.43.100
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Check positive-class F1 and regression guard
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: python -m src.artifacts gate

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install boto3==1.43.100
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Stage inference API source
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: aws s3 cp src/serve.py "s3://$ARTIFACT_BUCKET/deployment/serve.py"
      - name: Promote validated model
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: python -m src.artifacts promote
      - name: Deploy through Systems Manager and verify the API
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
          SERVER_INSTANCE_ID: ${{ secrets.SERVER_INSTANCE_ID }}
        run: |
          python - <<'PY' > /tmp/day21-ssm-parameters.json
          import json
          import os

          bucket = os.environ["ARTIFACT_BUCKET"]
          download = (
              "/home/ubuntu/income-venv/bin/python -c "
              + repr(
                  "import boto3; boto3.client('s3').download_file("
                  f"'{bucket}', 'deployment/serve.py', '/home/ubuntu/src/serve.py')"
              )
          )
          commands = [
              "set -eu",
              "/home/ubuntu/income-venv/bin/python -m pip install --no-cache-dir numpy==1.26.4 scipy==1.13.1",
              download,
              "chown ubuntu:ubuntu /home/ubuntu/src/serve.py",
              "systemctl restart income-api",
              "for attempt in 1 2 3 4 5; do curl -fsS http://localhost:8080/healthz && exit 0; sleep 3; done",
              "journalctl -u income-api -n 30 --no-pager",
              "exit 1",
          ]
          print(json.dumps({"commands": commands}))
          PY
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$SERVER_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/day21-ssm-parameters.json \
            --query 'Command.CommandId' --output text)
          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" --instance-id "$SERVER_INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$SERVER_INSTANCE_ID" \
              --query '[Status,StandardOutputContent,StandardErrorContent]' --output text || true
            exit 1
          fi
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$SERVER_INSTANCE_ID" \
            --query Status --output text)
          test "$STATUS" = Success
